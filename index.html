<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="HolaDoc! - Gestión de salud simple y directa entre pacientes y médicos. Turnos, recetas, derivaciones y seguimiento remoto.">
    <meta name="theme-color" content="#034C81">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>HolaDoc! — Tu salud, más simple</title>

    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Favicon (inline SVG as data URI) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏥</text></svg>">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- Root App Container -->
    <div id="app">
        <!-- SPA content rendered here by app.js -->
        <div class="loading-overlay" id="initial-loader">
            <div style="text-align:center;">
                <div style="font-size:64px;margin-bottom:16px;animation:float 2s ease-in-out infinite;">🏥</div>
                <div class="spinner" style="margin:0 auto 16px;"></div>
                <p style="font-size:19px;color:#475569;font-weight:500;">Cargando HolaDoc!...</p>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Scripts (loaded in dependency order) -->
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/patient.js"></script>
    <script src="js/doctor.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
