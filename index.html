<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tu Doctor de Cabecera — Plataforma de salud digital. Gestioná turnos, recetas digitales, derivaciones e historia clínica de forma rápida y segura.">
    <meta name="theme-color" content="#034C81">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta property="og:title" content="Tu Doctor de Cabecera — Tu salud, más simple">
    <meta property="og:description" content="Gestioná turnos, recetas digitales y tu historia clínica desde cualquier dispositivo.">
    <title>Tu Doctor de Cabecera — Plataforma de Salud Digital</title>

    <!-- Google Fonts - Poppins (loaded via base.css @import) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23034C81'/><text y='.85em' font-size='70' x='15'>🏥</text></svg>">

    <!-- Stylesheets — v8 Apicona Azul -->
    <link rel="stylesheet" href="css/variables.css?v=8">
    <link rel="stylesheet" href="css/base.css?v=8">
    <link rel="stylesheet" href="css/components.css?v=8">
    <link rel="stylesheet" href="css/layout.css?v=8">
    <link rel="stylesheet" href="css/animations.css?v=8">
    <link rel="stylesheet" href="css/responsive.css?v=8">

    <style>
      /* === APICONA PALETTE OVERRIDE — AZUL MÉDICO === */
      :root {
        --primary:          #034C81 !important;
        --primary-dark:     #023A63 !important;
        --primary-light:    #0369A1 !important;
        --primary-lightest: #EFF6FF !important;
        --primary-lighter:  #60A5FA !important;
        --dark-bg:          #1E1E1E !important;
        --dark-surface:     #2A2A2A !important;
        --bg-primary:       #F5F5F5 !important;
        --bg-surface:       #FFFFFF !important;
        --text-primary:     #1A1A1A !important;
        --text-secondary:   #444444 !important;
        --text-muted:       #666666 !important;
        --text-inverse:     #FFFFFF !important;
        --border-light:     #E0E0E0 !important;
        --shadow-card:      0 2px 12px rgba(0,0,0,0.08) !important;
        --shadow-3d:        0 8px 32px rgba(3,76,129,0.18) !important;
        --font-family:      'Poppins', 'Roboto', sans-serif !important;
        --radius-sm:        4px !important;
        --radius-md:        6px !important;
        --radius-lg:        8px !important;
        --navbar-height:    72px !important;
        --bottom-nav-height:68px !important;
        --topbar-height:    40px !important;
      }
      /* Botones primarios AZUL MÉDICO */
      .btn-primary {
        background: #034C81 !important;
        border-color: #034C81 !important;
        color: #fff !important;
      }
      .btn-primary:hover {
        background: #023A63 !important;
        border-color: #023A63 !important;
      }
      .btn-outline-dark {
        background: transparent !important;
        color: #1A1A1A !important;
        border: 2px solid #1A1A1A !important;
      }
      .btn-outline-dark:hover {
        background: #1A1A1A !important;
        color: #fff !important;
      }
      .btn-outline {
        background: transparent !important;
        color: #034C81 !important;
        border: 2px solid #034C81 !important;
      }
      .btn-outline:hover {
        background: #034C81 !important;
        color: #fff !important;
      }
      /* Links — azul médico */
      a { color: #034C81; }
      a:hover { color: #023A63; }
      /* Tabs activos */
      .tab-btn.active { color: #034C81 !important; border-bottom-color: #034C81 !important; }
      /* Bottom nav activo */
      .bottom-nav-item.active .bottom-nav-icon,
      .bottom-nav-item.active .bottom-nav-label { color: #034C81 !important; }
      .bottom-nav-item.active::before { background: #034C81 !important; }
      /* Hero title em */
      .hero-title em { color: #60A5FA !important; }
      /* Hero label */
      .hero-label { color: #60A5FA !important; }
      /* Section label */
      .section-label { color: #034C81 !important; }
      /* About badge */
      .about-badge { background: #034C81 !important; }
      /* Stat num */
      .stat-num { color: #034C81 !important; }
      /* Footer logo em */
      .footer-logo em { color: #60A5FA !important; }
      .logo-text span { color: #034C81 !important; }
      /* Initial loader */
      .loading-overlay {
        position: fixed; inset: 0;
        background: #1E1E1E;
        display: flex; align-items: center; justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      .loading-overlay.fade-out { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <!-- Root App Container -->
    <div id="app">
        <!-- Initial Loader -->
        <div class="loading-overlay" id="initial-loader">
            <div style="text-align:center;">
                <div style="font-size:60px;margin-bottom:20px;">🏥</div>
                <div style="width:40px;height:40px;border:3px solid rgba(255,255,255,0.15);border-top-color:#E8291C;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 16px;"></div>
                <p style="font-size:16px;color:rgba(255,255,255,0.6);font-weight:500;letter-spacing:1px;text-transform:uppercase;font-family:'Poppins',sans-serif;">Cargando Tu Doctor de Cabecera...</p>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Scripts v8 (loaded in dependency order) -->
    <script src="js/storage.js?v=8"></script>
    <script src="js/auth.js?v=8"></script>
    <script src="js/notifications.js?v=8"></script>
    <script src="js/patient.js?v=8"></script>
    <script src="js/doctor.js?v=8"></script>
    <script src="js/app.js?v=8"></script>

    <script>
      // Remove loader after app initializes
      window.addEventListener('load', function() {
        setTimeout(function() {
          var loader = document.getElementById('initial-loader');
          if (loader) {
            loader.classList.add('fade-out');
            setTimeout(function() { loader.remove(); }, 400);
          }
        }, 600);
      });
    </script>
</body>
</html>
