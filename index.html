<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HolaDoc! — Plataforma de salud digital. Gestioná turnos, recetas digitales, derivaciones e historia clínica de forma rápida y segura.">
    <meta name="theme-color" content="#E8291C">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta property="og:title" content="HolaDoc! — Tu salud, más simple">
    <meta property="og:description" content="Gestioná turnos, recetas digitales y tu historia clínica desde cualquier dispositivo.">
    <title>HolaDoc! — Plataforma de Salud Digital</title>

    <!-- Google Fonts - Poppins (loaded via base.css @import) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23E8291C'/><text y='.85em' font-size='70' x='15'>🏥</text></svg>">

    <!-- Stylesheets — v3 Apicona -->
    <link rel="stylesheet" href="css/variables.css?v=3">
    <link rel="stylesheet" href="css/base.css?v=3">
    <link rel="stylesheet" href="css/components.css?v=3">
    <link rel="stylesheet" href="css/layout.css?v=3">
    <link rel="stylesheet" href="css/animations.css?v=3">
    <link rel="stylesheet" href="css/responsive.css?v=3">

    <style>
      /* === APICONA PALETTE OVERRIDE (garantiza rojo aunque haya caché vieja) === */
      :root {
        --primary:          #E8291C !important;
        --primary-dark:     #C41E12 !important;
        --primary-light:    #FF4A3D !important;
        --primary-lightest: #FFF0EF !important;
        --primary-lighter:  #FF6B61 !important;
        --dark-bg:          #1E1E1E !important;
        --dark-surface:     #2A2A2A !important;
        --bg-primary:       #F5F5F5 !important;
        --bg-surface:       #FFFFFF !important;
        --text-primary:     #1A1A1A !important;
        --text-secondary:   #444444 !important;
        --text-muted:       #666666 !important;
        --text-inverse:     #FFFFFF !important;
        --border-light:     #E0E0E0 !important;
        --shadow-card:      0 2px 12px rgba(0,0,0,0.08) !important;
        --font-family:      'Poppins', 'Roboto', sans-serif !important;
        --radius-sm:        4px !important;
        --radius-md:        6px !important;
        --radius-lg:        8px !important;
        --navbar-height:    72px !important;
        --bottom-nav-height:68px !important;
        --topbar-height:    40px !important;
      }
      /* Botones primarios ROJO (override de caché) */
      .btn-primary {
        background: #E8291C !important;
        border-color: #E8291C !important;
        color: #fff !important;
      }
      .btn-primary:hover {
        background: #C41E12 !important;
        border-color: #C41E12 !important;
      }
      .btn-outline-dark {
        background: transparent !important;
        color: #1A1A1A !important;
        border: 2px solid #1A1A1A !important;
      }
      .btn-outline-dark:hover {
        background: #1A1A1A !important;
        color: #fff !important;
      }
      .btn-outline {
        background: transparent !important;
        color: #E8291C !important;
        border: 2px solid #E8291C !important;
      }
      /* Links — no azul */
      a { color: #E8291C; }
      a:hover { color: #C41E12; }
      /* Tabs activos — rojo */
      .tab-btn.active { color: #E8291C !important; border-bottom-color: #E8291C !important; }
      .bottom-nav-item.active .bottom-nav-icon,
      .bottom-nav-item.active .bottom-nav-label { color: #E8291C !important; }
      .bottom-nav-item.active::before { background: #E8291C !important; }
      /* Initial loader */
      .loading-overlay {
        position: fixed; inset: 0;
        background: #1E1E1E;
        display: flex; align-items: center; justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      .loading-overlay.fade-out { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <!-- Root App Container -->
    <div id="app">
        <!-- Initial Loader -->
        <div class="loading-overlay" id="initial-loader">
            <div style="text-align:center;">
                <div style="font-size:60px;margin-bottom:20px;">🏥</div>
                <div style="width:40px;height:40px;border:3px solid rgba(255,255,255,0.15);border-top-color:#E8291C;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 16px;"></div>
                <p style="font-size:16px;color:rgba(255,255,255,0.6);font-weight:500;letter-spacing:1px;text-transform:uppercase;font-family:'Poppins',sans-serif;">Cargando HolaDoc!...</p>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Scripts (loaded in dependency order) -->
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/patient.js"></script>
    <script src="js/doctor.js"></script>
    <script src="js/app.js"></script>

    <script>
      // Remove loader after app initializes
      window.addEventListener('load', function() {
        setTimeout(function() {
          var loader = document.getElementById('initial-loader');
          if (loader) {
            loader.classList.add('fade-out');
            setTimeout(function() { loader.remove(); }, 400);
          }
        }, 600);
      });
    </script>
</body>
</html>
